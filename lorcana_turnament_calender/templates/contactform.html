<h2>Contact form submission</h2>

<p>
    <strong>Name:</strong> {{ name }}<br>
    <strong>Email:</strong> {{ email }}<br>
    <strong>Stadt:</strong> {{ city }}<br>
    <strong>Event location:</strong> {{ eventlocation }}<br>
    <strong>Kapazität:</strong> {{ capacity }}<br>
    <strong>Erlaubnis:</strong>
    {% if permit %}Yes{% else %}No{% endif %}<br>
    <strong>Erfahrung:</strong> {{ experience }}
</p>

<p>
    <strong>Anmerkungen:</strong><br>
    {{ notes }}
</p>
